# Stack completo de producción: Postgres + ClamAV + backend + frontend,
# usando las imágenes ya construidas con `docker build` en cada repo.
# Prueba local antes de llevarlo a AWS.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Lee POSTGRES_PASSWORD y JWT_SECRET automáticamente desde el .env que ya
# existe en esta carpeta (Docker Compose carga el .env del mismo directorio
# por convención). Si quieres que también se siembre la cuenta admin al
# arrancar, agrega ADMIN_SEED_EMAIL y ADMIN_SEED_PASSWORD a ese mismo .env.

services:
  postgres:
    image: postgres:16
    container_name: gestion-admisiones-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_admisiones
      POSTGRES_USER: gestion_admisiones_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  clamav:
    image: clamav/clamav:stable
    container_name: gestion-admisiones-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - app_network

  backend:
    image: gestion-admisiones-backend:latest
    container_name: gestion-admisiones-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - clamav
    environment:
      DB_HOST: postgres
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLAMAV_HOST: clamav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    ports:
      - "8080:8080"
    networks:
      - app_network

  frontend:
    image: unac-inscripciones-frontend:latest
    container_name: unac-inscripciones-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
  clamav_data:
